name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # neither job pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22   # Business pilot validation baseline
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Loads DuckDB-WASM the way a visitor does (vendor/duckdb/ if committed, otherwise the jsDelivr CDN).
      - run: npm test

  generated-code:
    # Runs the code DataForge generates for the three samples and compares every target with the app's own output.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # neither job pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22   # Business pilot validation baseline
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/codegen/requirements.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install -r tests/codegen/requirements.txt
      - run: node tests/codegen/export.mjs codegen-out
      - run: python tests/codegen/verify.py codegen-out

  business-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:local
      # Requires a real browser origin; not exercised in the delivery environment.
      - run: npm run test:persistence
